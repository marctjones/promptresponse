[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2apr"
version = "0.1.0"
description = "Convert a PDF form into a PromptResponse APR template"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
# The naming model. Apple silicon only; everything else works without it,
# and `--no-model` skips this stage entirely.
model = ["mlx-vlm>=0.1.0; platform_system == 'Darwin'"]
test = ["pytest>=8"]

[project.scripts]
pdf2apr = "pdf2apr.cli:main"

[tool.setuptools.packages.find]
include = ["pdf2apr*"]
