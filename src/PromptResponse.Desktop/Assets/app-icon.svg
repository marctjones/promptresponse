<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- PromptResponse Application Icon -->
  <!-- Concept: Flowing dialogue - Prompt to Response -->

  <defs>
    <!-- Gradient for the flow -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ACC1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle (optional, for standalone icon) -->
  <circle cx="256" cy="256" r="240" fill="#F5F5F5" opacity="0"/>

  <!-- Left bubble (Prompt) - Teal -->
  <g filter="url(#shadow)">
    <rect x="64" y="160" width="160" height="192" rx="24" fill="#00ACC1"/>

    <!-- Question mark symbol -->
    <text x="144" y="280" font-family="Arial, sans-serif" font-size="96" font-weight="bold" fill="white" text-anchor="middle">?</text>

    <!-- Prompt lines (subtle) -->
    <line x1="90" y1="190" x2="198" y2="190" stroke="white" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <line x1="90" y1="215" x2="180" y2="215" stroke="white" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- Flow arrow -->
  <g>
    <!-- Arrow shaft -->
    <line x1="234" y1="256" x2="278" y2="256" stroke="url(#flowGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Arrow head -->
    <polygon points="278,256 262,246 262,266" fill="#66BB6A"/>
  </g>

  <!-- Right bubble (Response) - Green -->
  <g filter="url(#shadow)">
    <rect x="288" y="160" width="160" height="192" rx="24" fill="#66BB6A"/>

    <!-- Checkmark symbol -->
    <path d="M 330 256 L 358 284 L 406 220" stroke="white" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Response lines (filled) -->
    <line x1="314" y1="310" x2="422" y2="310" stroke="white" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
    <line x1="314" y1="330" x2="390" y2="330" stroke="white" stroke-width="4" opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>
