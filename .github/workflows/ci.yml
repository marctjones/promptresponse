name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / .NET 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore

      - name: Build (Release, warnings-as-errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test (all projects, with coverage)
        run: >-
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/**/*.trx
            ./TestResults/**/coverage.cobertura.xml
            ./TestResults/**/coverage.opencover.xml

  accessibility-gate:
    name: Accessibility tests (mandatory)
    runs-on: ubuntu-latest
    # No `needs:`. This job builds what it tests; waiting on the full solution
    # suite only meant that one failure elsewhere skipped the gate CI calls
    # non-negotiable.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore

      - name: Run accessibility tests
        # Vision-critical: this is a non-negotiable gate, separated for visibility.
        # Any failure here blocks merge regardless of other test status.
        run: dotnet test tests/PromptResponse.AccessibilityTests --configuration Release --logger "console;verbosity=normal"

  format-schema-gate:
    name: APR schema gate (language-neutral)
    runs-on: ubuntu-latest
    # No `needs:`. These gates check the specification and the artifacts derived
    # from it, and read no SDK. Making them wait on `build-and-test` meant that
    # while the .NET suite was misaligned with beta.6 they never ran at all — the
    # corpus, conformance and rule-evidence gates were skipped on every push, and
    # a skipped gate reports the same green as a passing one.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install specification and conformance tooling dependencies
        # None of these is optional. PyYAML reads the beta.6 APR-YAML forms and
        # streams, so without it half the corpus would pass by being unreadable;
        # cel-python evaluates the expression cases, and asn1crypto with
        # cryptography rebuilds the signed attestation fixtures. A gate reports a
        # missing package as a failure rather than skipping the work it gates.
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Test the oracle against RFC 8785's own vectors
        # Every digest in the corpus is computed by scripts/aprlib.py, so a defect
        # in it is a defect in every digest the suite states, and four SDKs would
        # then be judged wrong for being right. Held to the RFC's published
        # example, its property ordering, and its IEEE 754 serialization pairs.
        run: python3 scripts/check-oracle.py

      - name: Test the expression oracle against the pinned CEL surface
        # Language conformance is cel-spec's; this checks the surface section 11.3
        # pins is present, the extension libraries it forbids are absent, and
        # activation, degradation and marshalling behave as section 11 states.
        run: python3 scripts/check-expression-oracle.py

      - name: Verify the test registry agrees with the repository
        # tests/registry.json claims which spec requirements are gated. A coverage
        # registry nobody checks becomes a document describing a project that no longer
        # exists, so the claim itself is verified: every named fixture and test must
        # exist, every fixture must be claimed, and every normative spec section must
        # have an entry.
        run: python3 scripts/check-test-registry.py

      - name: Verify every digest in the conformance corpus
        # Subject digests, manifest entries and witnesses are values computed over
        # other records. Nothing else checks them, so a stale one would survive
        # every other gate: the schema checks shape, and the SDK suites check the
        # SDKs against the same stale bytes.
        run: python3 scripts/check-corpus.py

      - name: Verify the corpus is what regenerating it would produce
        # Attestations are derived from the forms they cover. This proves the
        # committed fixtures are reproducible, so a specification change is a
        # regeneration rather than a hand edit nobody can redo.
        run: python3 scripts/build-corpus.py

      - name: Validate the specification's own examples
        # A validator built from the specification, checked against the examples
        # the specification publishes. An example marked valid that it rejects
        # means one of the two is wrong; an example marked rejected that it
        # accepts means the validator is missing a rule the document states.
        run: python3 scripts/validate-apr.py --spec-examples

      - name: Verify the conformance suite is current
        run: python3 scripts/build-suite.py

      - name: Score the reference driver against the conformance suite
        # The suite and the harness that scores it are what make "a validated
        # implementation" mean something. Running the reference driver proves the
        # harness works; a real implementation supplies its own driver.
        run: python3 scripts/run-conformance.py --driver "python3 scripts/reference-driver.py"

      - name: Verify the renderer suite is current
        run: python3 scripts/build-renderer-suite.py

      - name: Score the reference renderer against the renderer suite
        # Twelve rules no document vector can reach. A renderer driver reports what a
        # person ended up in front of, and these check that against chapter 13.
        run: python3 scripts/run-renderer-conformance.py --driver "python3 scripts/reference-renderer-driver.py"

      - name: Prove the renderer scorer fails a broken renderer
        # More exposed than the document harness: these checks are judgements about a
        # snapshot rather than comparisons against a digest, so a check that quietly
        # stopped deciding would look exactly like one that passes.
        run: python3 scripts/check-renderer-teeth.py

      - name: Prove the harness fails a broken driver
        # The harness was exercised by one driver, written by its own author,
        # which passes everything. Eight mutant drivers — each correct except in
        # one named way — must each fail at least one case, or the harness is not
        # checking what that mutant breaks.
        run: python3 scripts/check-harness-teeth.py

      - name: Report how much of the specification the suite reaches
        # Passing the suite should mean something, and how much it means is the
        # number of rules it exercises. Coverage itself is not gated; a case that
        # cites no rule is, because it is measured as nothing.
        run: python3 scripts/check-suite-coverage.py

      - name: Verify per-rule conformance evidence
        # For every rule in the OSCAL catalogue: is it enforced, is there a document
        # that satisfies it, is there one that violates it, and is that violation
        # caught traceably. Gates two invariants and ratchets the counts so coverage
        # cannot fall.
        run: python3 scripts/check-rule-evidence.py

      - name: Verify the OSCAL rule catalog is current
        # Every rule identifier is projected into an OSCAL control so completeness
        # policies can be written against the same identifiers the spec uses.
        run: python3 scripts/build-oscal.py

      - name: Verify the conformance statement is current
        # The statement lists every rule by profile and class of product, read from the
        # OSCAL catalog. Regenerating it must be a no-op, or it has drifted from the rules.
        run: python3 scripts/build-conformance-statement.py

      - name: Verify the specification release manifest is current
        # A published baseline must identify the exact bytes it published, or the
        # version string names a moving target.
        run: python3 scripts/build-spec.py

      - name: Verify the specification covers its inventories
        # Every concept the registry names, every member the schema declares, and
        # every conformance profile must be accounted for in the prose. Also that
        # no recorded gap still explains why a rule has no evidence after the
        # evidence arrived: a registry describing a project that has moved on is
        # how a registry stops being read.
        run: python3 scripts/check-spec-completeness.py

      - name: Verify the review rubric is current
        # The opt-in local review is never a gate, but the rubric it asks is
        # derived from the specification and goes stale silently. Regenerating it
        # must be a no-op.
        run: |
          python3 scripts/build-review-rubric.py --write
          git diff --exit-code tests/spec-semantic/completeness-rubric.json

      - name: Verify the schema agrees with the specification
        # The specification is normative and the schema is a derived projection of
        # it. Every documented member must be declared and every declared member
        # documented, so the two cannot drift apart unnoticed.
        run: python3 scripts/check-schema-agrees.py

      - name: Verify the specification has its declared shape
        # tests/spec-shape/manifest.json records the structural properties borrowed
        # from CommonMark, YAML 1.2.2 and RFC 8259. This checks them, so "written
        # like those specifications" is verified rather than asserted.
        run: python3 scripts/check-spec-shape.py

      - name: Verify the conformance vectors still match the specification
        # The specification is normative and the corpus is derived from it. This
        # regenerates the vectors from the examples embedded in the specification
        # and fails if the committed file differs, so prose and evidence cannot drift.
        run: python3 scripts/extract-spec-examples.py

      - name: Test the example extractor on every header key and malformed headers
        run: python3 scripts/extract-spec-examples.py --self-test

      - name: Test the specification rewrite tools
        # The rewrite to the W3C writing approach is tracked by these tools, so each
        # proves on its fixture that it catches what it claims before its report is
        # believed. The tools are gated; what they report about the text is not.
        run: |
          python3 scripts/spec-units.py --self-test
          python3 scripts/check-spec-conversion.py --self-test
          python3 scripts/check-spec-approach.py --self-test
          python3 scripts/check-example-coverage.py --self-test

      - name: Gate the specification's writing approach
        # Every unit of the baseline specification carries an applied disposition,
        # and the approach lint finds nothing: a requirement names a defined class of
        # product, states one level, carries a rule, and no text describes history.
        run: |
          python3 scripts/check-spec-conversion.py --gate
          python3 scripts/check-spec-approach.py --gate

      - name: Report example coverage
        # Report mode until every rule is shown by an example or holds a recorded
        # exception naming the test that covers it (#488).
        if: always()
        run: |
          mkdir -p spec-rewrite-report
          python3 scripts/check-example-coverage.py > spec-rewrite-report/example-coverage.txt
          python3 scripts/check-example-coverage.py --json > spec-rewrite-report/example-coverage.json
          { echo "### Example coverage"; echo '```'; head -n 40 spec-rewrite-report/example-coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the specification rewrite report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-rewrite-report
          path: spec-rewrite-report/

      - name: Verify release-status documentation agrees with the repository
        run: python3 scripts/check-docs.py

      - name: Validate the conformance corpus against the published JSON Schema
        # The .NET conformance tests prove the reference implementation is correct;
        # this proves schemas/apr-1.0.schema.json agrees with it. Without this gate the
        # schema silently drifts, and the schema is what non-.NET SDKs implement from.
        # Deliberately uses no .NET, so it fails the same way a third-party SDK would.
        run: python3 scripts/check-schema.py

  coverage-gate:
    name: Coverage gate (Core ≥90%, Desktop ≥72%, Cli ratcheting)
    runs-on: ubuntu-latest
    # No `needs:`. It runs its own collection; the thresholds in its name are the
    # bar, and they are meaningless while the job is skipped.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore

      # Run coverage gate per project that's testable today. Desktop is excluded
      # at this gate level because the legacy god-class ViewModels are slated for
      # Phase 3/4 refactor; once split, they'll be added to this gate.
      - name: Core coverage gate
        # .NET 10 / Coverlet 10 measured the existing Core suite at 90.43% lines.
        # Keep the bar just below that verified baseline and raise it with new tests;
        # do not claim the obsolete 95% target until it is actually achieved.
        # MSBuild treats literal commas in /p values as property separators;
        # Coverlet decodes %2c back to its filter separator.
        run: >-
          dotnet test tests/PromptResponse.Core.Tests
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=90
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Exclude="[xunit.*]*%2c[*.Tests]*%2c[*.Tests.*]*"

      - name: Desktop coverage gate
        # Desktop was excluded from coverage gating entirely while its GUI suite could
        # not run (issue #30). Re-measured 2026-09-07 with 2246 tests reporting
        # solution-wide: 82.08% line coverage, so the bar is set just below it: high
        # enough that a regression fails, low enough that it does not fail on noise.
        # Raise it as coverage improves rather than leaving headroom permanently.
        run: >-
          dotnet test tests/PromptResponse.Desktop.Tests
          --configuration Release
          -m:1
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Include="[PromptResponse.Desktop]*"
          /p:Exclude="[xunit.*]*%2c[*.Tests]*%2c[*.Tests.*]*"

      - name: GUI activation ratchet
        # Line coverage says which code ran. This says which of the controls a person can
        # actually reach was clicked, typed into or toggled — written by the Desktop suite
        # that just ran, so the figure is reproducible rather than a committed snapshot
        # nothing regenerates. Only activation gates; a control whose name merely appears
        # in a test source is reported, because a mention in a comment would satisfy it.
        run: python3 scripts/check-gui-coverage.py --gate

      - name: Cli coverage gate (ratcheting)
        # Measured 2026-09-07: 76.89% line coverage on the apr assembly alone (the
        # CLI's AssemblyName; /p:Include scopes coverlet to it explicitly rather than
        # relying on the default assembly-discovery behavior, which happened to
        # produce the same figure but shouldn't be trusted to keep doing so). The
        # previous 28% threshold predated this measurement and never moved once
        # coverage grew past it, so it had stopped ratcheting anything (#345). Bar set
        # just below the verified baseline, same convention as the Core and Desktop
        # gates above; raise it as coverage improves.
        run: >-
          dotnet test tests/PromptResponse.Cli.Tests
          --configuration Release
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=74
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Include="[apr]*"
          /p:Exclude="[xunit.*]*%2c[*.Tests]*%2c[*.Tests.*]*%2c[apr]PromptResponse.Cli.Program"

  sdk-suites:
    name: SDK suites (Python, TypeScript, browser demo, Java)
    runs-on: ubuntu-latest
    # Separate from the language-neutral gate on purpose. These four suites are
    # implementations measured against the specification. Every SDK's wire format
    # is aligned to beta.6, and as of issue #379, Python, TypeScript and Java are
    # all scored against the conformance suite itself, alongside the two .NET
    # drivers in conformance-drivers below.
    # This job must not be able to take the specification gates down with it.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            demos/web/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      # The Python SDK runs the same corpus as the .NET one. A second
      # implementation disagreeing is the cheapest signal that the corpus or the
      # spec is ambiguous, and it is the only thing here that can exercise the
      # core-only profile rules at all.
      - name: Python SDK tests
        working-directory: python
        run: |
          uv sync --all-extras --locked
          uv run pytest -q

      - name: Score the Python SDK against the conformance suite
        # python/conformance_driver.py answers with the shipped promptresponse
        # package (not scripts/aprlib.py's SDK-free oracle), run through the same
        # uv environment `uv sync` just built so it has celpy and PyYAML. Claims
        # core, core+streams and core+expressions; core+attestations is
        # deliberately unclaimed, matching both .NET drivers below.
        run: >-
          python3 scripts/run-conformance.py
          --driver "python/.venv/bin/python python/conformance_driver.py"

      - name: Python dead-code check
        # vulture's default per-kind confidence for an unused function or method is
        # 60%, so --min-confidence 80 (vulture's own "safe" bar) silently excludes
        # that whole category — a gate that would never have caught anything. Scoped
        # to promptresponse + tests + the one script that calls into it, so cross-file
        # usage is visible; python/vulture_whitelist.py names the few real positives
        # confirmed intentional on 2026-09-07 rather than accidental.
        working-directory: python
        run: >-
          uv run vulture promptresponse tests ../scripts/run-spec-semantic-review.py
          vulture_whitelist.py --min-confidence 60

      - name: TypeScript SDK and HTML renderer tests
        # Reported even when an earlier suite failed. These four are independent
        # implementations, and letting the first failure skip the rest means one known
        # gap hides the state of three others: unmeasured reads as neither red nor green.
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: |
          npm ci
          npm test

      - name: Score the TypeScript SDK against the conformance suite
        # typescript/conformance-driver.mjs answers with the built dist/ output --
        # the actual package a caller installs, not a hand-rolled parser. Claims
        # core, core+streams and core+expressions; core+attestations is
        # deliberately unclaimed, matching the Python and .NET drivers.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/run-conformance.py
          --driver "node typescript/conformance-driver.mjs"

      - name: TypeScript dead-export and unused-dependency check
        # An unused dependency or export doesn't fail a build, so nothing else here
        # would ever catch one. knip found and removed one real case (asn1js, already
        # transitive through pkijs) on 2026-09-07; keeping it wired in stops the next
        # one from sitting unnoticed the same way.
        if: ${{ !cancelled() }}
        working-directory: typescript
        run: npm run knip

      - name: Browser demo tests
        # Reported even when an earlier suite failed. These four are independent
        # implementations, and letting the first failure skip the rest means one known
        # gap hides the state of three others: unmeasured reads as neither red nor green.
        if: ${{ !cancelled() }}
        working-directory: demos/web
        run: |
          npm ci
          npm test

      - name: Java SDK shared-corpus tests
        # Reported even when an earlier suite failed. These four are independent
        # implementations, and letting the first failure skip the rest means one known
        # gap hides the state of three others: unmeasured reads as neither red nor green.
        if: ${{ !cancelled() }}
        run: java/run-tests.sh

      - name: Score the Java SDK against the conformance suite
        # java/run-conformance-driver.sh answers with the built org.promptresponse
        # classes -- the actual library a caller depends on. Claims core,
        # core+streams and core+expressions; core+attestations is deliberately
        # unclaimed, matching the Python, TypeScript and .NET drivers.
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/run-conformance.py
          --driver "java/run-conformance-driver.sh"

  conformance-drivers:
    name: Conformance drivers (library, CLI, desktop client, exporter)
    runs-on: ubuntu-latest
    # Its own job, not the tail of sdk-suites. These four steps are the evidence that the
    # shipped .NET library, the command line, the desktop client and the exporter conform,
    # and they read no SDK. Sitting below the Python suite meant the first CI run to carry
    # them scored nothing at all: one expected failure, in an SDK knowingly behind the wire
    # format, skipped every driver beneath it. A skipped driver reports the same green as a
    # passing one.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install conformance tooling dependencies
        # scripts/aprlib.py computes every digest the suite states and reads the APR-YAML
        # half of the corpus, so PyYAML is load-bearing rather than optional here too.
        run: pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Score both .NET drivers against the conformance suite
        # Two drivers over one library, and the difference is the finding. The library
        # driver says PromptResponse.Core is conformant; the CLI driver says the program
        # a person runs is. A defect in the library shows in both; a defect in the
        # command line's own layer shows in one, and neither could say that alone.
        run: |
          # One project per invocation: MSBuild refuses two (MSB1008).
          dotnet build tools/PromptResponse.ConformanceDriver -v q
          dotnet build src/PromptResponse.Cli -v q
          python3 scripts/run-conformance.py --driver "dotnet run --project tools/PromptResponse.ConformanceDriver --no-build -v q"
          python3 scripts/run-conformance.py --driver "dotnet run --project src/PromptResponse.Cli --no-build -v q -- conformance"

      - name: Score the Avalonia client against the renderer suite
        # The desktop client is the one renderer a person actually uses, and until this
        # step it was the only one with no evidence at all. It boots the shipped App
        # headlessly and reports accessible names and roles read off the automation tree a
        # screen reader consumes, the focus order from real Tab traversal, and the network
        # requests the runtime made.
        run: |
          dotnet build tools/PromptResponse.RendererDriver.Avalonia -v q
          python3 scripts/run-renderer-conformance.py --driver "dotnet run --project tools/PromptResponse.RendererDriver.Avalonia --no-build -v q"

      - name: Score the PDF exporter against the renderer suite
        # APR-RENDER-009 says an export is never written back, which is a rule about the
        # thing that exports. Avalonia does not export, so this driver is the only place
        # it can be asked, and it declares only the exporter surface: the twelve renderer
        # cases come back unanswered rather than falsely passed.
        run: |
          dotnet build tools/PromptResponse.RendererDrivers -v q
          python3 scripts/run-renderer-conformance.py --driver "dotnet run --project tools/PromptResponse.RendererDrivers --no-build -v q"
