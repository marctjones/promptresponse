name: Release

# Build self-contained, single-file artifacts (no .NET runtime needed on the
# user's machine) and attach them to the GitHub release.
#   • push a v* tag   → builds + attaches to that tag's release
#   • workflow_dispatch → manual run against a supplied version
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.3.0 (workflow_dispatch only)'
        required: true

permissions:
  contents: write

env:
  # Must match global.json and the committed NuGet lock graphs.
  DOTNET_VERSION: '10.0.300'

jobs:
  # ── Linux: self-contained tarball (binaries + desktop installer) ──────
  linux:
    name: Linux x64 (tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (self-contained, single-file)
        run: bash scripts/publish.sh --rid linux-x64 --version "${{ steps.ver.outputs.version }}"
      - name: Smoke-test staged artifact
        run: >-
          bash scripts/release-smoke.sh
          --rid linux-x64
          --version "${{ steps.ver.outputs.version }}"
          --stage "dist/promptresponse-${{ steps.ver.outputs.version }}-linux-x64"
          --skip-publish
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: dist/*.tar.gz

  # ── Windows: Inno Setup installer + portable zip ─────────────────────
  windows:
    name: Windows x64 (installer + zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish Desktop + CLI (self-contained, single-file)
        shell: pwsh
        run: |
          $common = @(
            '-c','Release','-r','win-x64','--self-contained','true',
            '-p:PublishSingleFile=true','-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:DebugType=none','-p:DebugSymbols=false',
            "-p:Version=${{ steps.ver.outputs.version }}",'--nologo','--no-restore','-o','publish/win-x64'
          )
          dotnet restore src/PromptResponse.Desktop -r win-x64 -p:RestoreLockedMode=false --nologo
          dotnet restore src/PromptResponse.Cli -r win-x64 -p:RestoreLockedMode=false --nologo
          dotnet publish src/PromptResponse.Desktop @common
          dotnet publish src/PromptResponse.Cli     @common
          # The Desktop assembly publishes as PromptResponse.Desktop.exe; the
          # installer + zip expect promptresponse.exe (the CLI is already apr.exe).
          Rename-Item publish/win-x64/PromptResponse.Desktop.exe promptresponse.exe
      - name: Portable zip
        shell: pwsh
        run: |
          $name = "promptresponse-${{ steps.ver.outputs.version }}-win-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item publish/win-x64/promptresponse.exe,publish/win-x64/apr.exe,LICENSE,README.md "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip" -Force
      - name: Smoke-test staged artifact
        shell: bash
        run: >-
          bash scripts/release-smoke.sh
          --rid win-x64
          --version "${{ steps.ver.outputs.version }}"
          --stage "dist/promptresponse-${{ steps.ver.outputs.version }}-win-x64"
          --skip-publish
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # ISCC resolves relative paths against the .iss folder, so pass
          # absolute paths for the publish output, repo root, and output dir.
          $root = "${{ github.workspace }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "/DPublishDir=$root\publish\win-x64" "/DRepoRoot=$root" `
            "/O$root\dist" "$root\packaging\windows\promptresponse.iss"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            dist/*.zip
            dist/*-setup.exe

  # ── macOS: self-contained tarballs (Apple Silicon + Intel) ───────────
  # Single-file binaries; a notarized .app bundle is a follow-up (needs an
  # Apple signing identity). Users gatekeeper-approve on first launch.
  macos:
    name: macOS (tarballs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Publish (self-contained, single-file)
        run: |
          bash scripts/publish.sh --rid osx-arm64 --version "${{ steps.ver.outputs.version }}"
          bash scripts/publish.sh --rid osx-x64   --version "${{ steps.ver.outputs.version }}"
      - name: Smoke-test Apple Silicon staged artifact
        if: runner.arch == 'ARM64'
        run: >-
          bash scripts/release-smoke.sh
          --rid osx-arm64
          --version "${{ steps.ver.outputs.version }}"
          --stage "dist/promptresponse-${{ steps.ver.outputs.version }}-osx-arm64"
          --skip-publish
      - name: Smoke-test Intel staged artifact
        if: runner.arch == 'X64'
        run: >-
          bash scripts/release-smoke.sh
          --rid osx-x64
          --version "${{ steps.ver.outputs.version }}"
          --stage "dist/promptresponse-${{ steps.ver.outputs.version }}-osx-x64"
          --skip-publish
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: dist/*.tar.gz

  # ── document-to-apr skill: a portable Markdown bundle (versioned ──────
  # independently of the app) so non-Claude-Code agents can download it.
  skill:
    name: document-to-apr skill (zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve versions
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            app="${{ github.event.inputs.version }}"
          else
            app="${GITHUB_REF#refs/tags/}"; app="${app#v}"
          fi
          # Skill carries its own SemVer in SKILL.md frontmatter.
          skill="$(grep -m1 '^version:' .claude/skills/document-to-apr/SKILL.md | sed 's/version:[[:space:]]*//')"
          echo "app=$app"     >> "$GITHUB_OUTPUT"
          echo "skill=$skill" >> "$GITHUB_OUTPUT"
      - name: Bundle skill
        run: |
          mkdir -p dist
          ( cd .claude/skills && zip -r "../../dist/document-to-apr-skill-${{ steps.ver.outputs.skill }}.zip" document-to-apr )
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.app }}
          files: dist/document-to-apr-skill-*.zip
