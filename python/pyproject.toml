[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptresponse"
version = "1.0.0b1"
description = "Reader, writer, and CEL expression evaluator for the APR form format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cel-python==0.5.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["promptresponse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
